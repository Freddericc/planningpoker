name: Bump version

on:
  push:
    branches: [main]

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Increment minor version
        run: |
          CURRENT=$(grep -oP '(?<=>v)[0-9]+\.[0-9]+(?=<)' index.html | head -1)
          MAJOR=$(echo "$CURRENT" | cut -d. -f1)
          MINOR=$(echo "$CURRENT" | cut -d. -f2)
          NEW_MINOR=$((MINOR + 1))
          NEW_VERSION="${MAJOR}.${NEW_MINOR}"
          sed -i "s/>v${CURRENT}</>v${NEW_VERSION}</g" index.html
          sed -i "s/>v${CURRENT}</>v${NEW_VERSION}</g" room.html
          echo "NEW_VERSION=v${NEW_VERSION}" >> $GITHUB_ENV

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html room.html
          git diff --staged --quiet || git commit -m "chore: bump to $NEW_VERSION [skip ci]"
          git push
