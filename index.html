<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Planning Poker</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .logo { font-size: 3rem; margin-bottom: 12px; }
    h1 { font-size: 2rem; color: #fff; margin-bottom: 6px; }
    .subtitle { color: #666; margin-bottom: 48px; font-size: 0.95rem; }

    .card {
      background: #16213e;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 400px;
      margin-bottom: 16px;
    }

    h2 {
      font-size: 0.8rem;
      color: #666;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 20px;
    }

    input {
      width: 100%;
      padding: 12px 16px;
      background: #0f3460;
      border: 1px solid #1e4a7a;
      border-radius: 8px;
      color: #fff;
      font-size: 1rem;
      margin-bottom: 10px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus { border-color: #e94560; }
    input::placeholder { color: #3a5a80; }

    button {
      width: 100%;
      padding: 13px;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .btn-primary { background: #e94560; color: #fff; }
    .btn-primary:hover { background: #c73652; }

    .btn-secondary {
      background: transparent;
      color: #e0e0e0;
      border: 1px solid #1e4a7a;
    }
    .btn-secondary:hover { background: #1e4a7a; }

    .error {
      color: #e94560;
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }
  </style>
</head>
<body>

  <div class="logo">🃏</div>
  <h1>Planning Poker</h1>
  <p class="subtitle">Schätzungen im Team – einfach & live</p>

  <div class="card">
    <h2>Neuen Raum erstellen</h2>
    <input type="text" id="createName" placeholder="Dein Name" maxlength="30">
    <button class="btn-primary" onclick="createRoom()">Raum erstellen →</button>
    <p class="error" id="createError">Bitte gib deinen Namen ein.</p>
  </div>

  <div class="card">
    <h2>Bestehendem Raum beitreten</h2>
    <input type="text" id="joinName" placeholder="Dein Name" maxlength="30">
    <input type="text" id="joinCode" placeholder="Raum-Code (z.B. sprint42)" maxlength="30">
    <button class="btn-secondary" onclick="joinRoom()">Beitreten</button>
    <p class="error" id="joinError">Bitte Name und Raum-Code eingeben.</p>
  </div>

  <script>
    function generateId() {
      return Math.random().toString(36).substring(2, 8);
    }

    function createRoom() {
      const name = document.getElementById('createName').value.trim();
      const err = document.getElementById('createError');
      if (!name) { err.style.display = 'block'; return; }
      err.style.display = 'none';
      const roomId = generateId();
      window.location.href = `room.html?room=${roomId}&name=${encodeURIComponent(name)}`;
    }

    function joinRoom() {
      const name = document.getElementById('joinName').value.trim();
      const code = document.getElementById('joinCode').value.trim().toLowerCase().replace(/\s+/g, '');
      const err = document.getElementById('joinError');
      if (!name || !code) { err.style.display = 'block'; return; }
      err.style.display = 'none';
      window.location.href = `room.html?room=${encodeURIComponent(code)}&name=${encodeURIComponent(name)}`;
    }

    document.addEventListener('keydown', e => {
      if (e.key !== 'Enter') return;
      const id = document.activeElement?.id;
      if (id === 'createName') createRoom();
      else if (id === 'joinName' || id === 'joinCode') joinRoom();
    });
  </script>

</body>
</html>
